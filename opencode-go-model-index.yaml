schema_version: "1.0"

metadata:
  purpose: "Deterministic model routing for OpenCode Go builders and planners, optimized for reliable task completion per token consumed."
  provider: "opencode-go"
  subscription: "OpenCode Go / Go Plus"
  plan_verified: false
  plan_note: "Stored OpenCode Console credentials are present, but the CLI does not expose whether the plan is Go or Go Plus; both plans share the catalogue below."
  verification_date: "2026-10-28"
  opencode_version: "2.2.0"
  catalogue:
    go_models: 30
    verified_against:
      - "official OpenCode Go documentation"
      - "public Go models endpoint"
      - "installed OpenCode CLI and model catalog"
    wider_provider_excluded: "opencode"
  retrieval_tags:
    - "opencode-go"
    - "model-routing"
    - "agent-orchestration"
    - "token-efficiency"
    - "builder"
    - "planner"
    - "fallback"
  comparison_basis: "Public benchmark and vendor-reported results; cross-harness comparisons are directional and are not capability-equivalence claims."
  alias_policy: "No separate alias IDs were observed; use the exact opencode-go/<model-id> values in this file."
  change_summary: "Initial index: 30 Go models verified, three builder tiers and three planning tiers selected, three role fallbacks recorded."

routing:
  policy: "least_resource_intensive_model_likely_to_complete"
  builders:
    smart:
      ref: "kimi-k3.1-pro"
      use_for: "complex implementation, difficult debugging, substantial refactoring, cross-file reasoning"
      default_effort: "high"
      effort_values: ["low", "high", "max"]
      fallback:
        ref: "gemini-4-argon"
        default_effort: "high"
        effort_values: ["low", "medium", "high"]
        tradeoff: "stronger repository synthesis and DeepSWE, weaker terminal-agentic coding, promo pricing ends 2026-11-30"
    fast:
      ref: "deepseek-v4.1-flash"
      use_for: "routine implementation, focused fixes, well-defined coding tasks"
      default_effort: "high"
      effort_values: ["low", "high", "max"]
      snapshot_risk: "Go release metadata matches the 0910 snapshot; compare the 1017 scores before assuming them"
      fallback:
        ref: "minimax-m3.1-flash"
        default_effort: "medium"
        effort_values: ["low", "medium", "high", "xhigh", "max"]
        tradeoff: "fewer output tokens and lower cost per task, lower terminal-coding score, more confident hallucination"
    light:
      ref: "gpt-6-luna"
      use_for: "simple bounded changes, repetitive edits, clear acceptance criteria"
      default_effort: "low"
      effort_values: ["none", "low", "medium", "high", "xhigh", "max"]
      fallback:
        ref: "claude-haiku-5-5"
        default_effort: "medium"
        effort_values: ["none", "low", "medium", "high", "xhigh", "max"]
        tradeoff: "stronger coding and tool use, 100K price tier and 30-day retention"
  planners:
    complex:
      rank: 1
      ref: "kimi-k3.1-pro"
      use_for: "architectural planning, ambiguous requirements, dependency analysis"
      default_effort: "high"
      effort_values: ["low", "high", "max"]
    ordinary:
      rank: 2
      ref: "deepseek-v4.1-flash"
      use_for: "ordinary implementation planning and task decomposition"
      default_effort: "high"
      effort_values: ["low", "high", "max"]
    small:
      rank: 3
      ref: "gpt-6-luna"
      use_for: "small bounded plans with explicit acceptance criteria"
      default_effort: "low"
      effort_values: ["none", "low", "medium", "high", "xhigh", "max"]
  defaults:
    builder: "deepseek-v4.1-flash"
    planner: "deepseek-v4.1-flash"
  strongest:
    builder_difficult: "kimi-k3.1-pro"
    planner_difficult: "kimi-k3.1-pro"
    basis: "Informed judgment from long-horizon coding and agentic reasoning benchmarks; no planning-specific benchmark was run."
  selection_policy:
    order:
      - "Use the light route for a single bounded change with clear acceptance criteria."
      - "Use the fast route for ordinary implementation, focused fixes, and routine planning."
      - "Use the smart route for ambiguous, cross-file, long-horizon, or previously failed work."
      - "Use a separate planner only when ambiguity or dependency risk justifies its token cost."
    retry_rule: "Retry once at higher effort on the same model, then move to that role's fallback; do not loop repairs on the cheapest model."
    fallback_rule: "A fallback can relieve model-specific congestion or a model allowance, but not a shared auth, billing, or provider outage."
    context_rule: "Pass the task, acceptance criteria, and only the relevant files or excerpts; do not pass the whole index or parent conversation."
    effort_rule: "Start at the route default and escalate only after a failed verification or a concrete ambiguity."
  capacity_notes:
    model_specific_limit: "Go monthly allowances are per model, so a model-specific limit can be relieved by switching to another Go model with headroom."
    shared_limit: "Workspace authentication, billing, or a provider-wide outage affects every Go model; switching models does not resolve it."
    transient_congestion: "For a 429 or transient 5xx, retry once, then use the role fallback."
    free_models: "Beam Free and Iceman Contributor Free are limited-time or restricted offers, not dependable paid-quota fallbacks."
    alias_rule: "Different effort variants of one model are not independent fallbacks."

retrieval:
  routing_path: ".routing"
  model_path: ".models[\"<key>\"]"
  fallback_path: ".routing.builders.<role>.fallback"
  example: "yq '.models[\"kimi-k3.1-pro\"]' opencode-go-model-index.yaml"
  cost_rule: "Read .routing first, then one model record and its fallback only; do not load all models."

effort_control:
  mechanism: "model string suffix or agent variant"
  syntax: "opencode-go/<model-id>#<variant>"
  agent_config_key: "variant"
  catalog_source: "installed OpenCode catalog variants"
  reasoning_budget: "not exposed separately; use only the listed variant names"
  output_limit: "separate from effort; recorded in max_output_tokens where verified"
  invalid_values: "an unlisted variant fails model resolution"
  none_semantics: "the literal variant none disables or omits provider reasoning only where listed"
  mode_semantics: "minimax-m3 exposes thinking as a mode, not an effort level"
  sources: ["oc_variants", "oc_schema", "oc_catalog"]

reference_tiers:
  deepseek_flash:
    reference_id: "deepseek/deepseek-flash"
    go_ref: "deepseek-v4.1-flash"
    status: "family_match_snapshot_unverified"
    note: "Go release metadata matches the September V4.1 Flash; the October 1017 snapshot is not confirmed."
  gpt_6_1_sol:
    reference_id: "opencode/gpt-6.1-sol"
    go_ref: null
    status: "not_in_go"
    closest_go_ref: "kimi-k3.1-pro"
    note: "GPT-6.1 Sol is in the separate opencode provider, not the Go catalogue."
    closest_note: "Kimi K3.1 Pro is the closest verified Go model; this is not a formal capability equivalence."
  gpt_6_luna:
    reference_id: "opencode/gpt-6-luna"
    go_ref: "gpt-6-luna"
    status: "same_model_in_go"
    note: "GPT-6 Luna is directly available in Go."

non_go_catalogue:
  provider: "opencode"
  examples:
    - "opencode/gpt-6.1-sol"
    - "opencode/gpt-6-astra"
    - "opencode/claude-opus-5-5"
  note: "These are in the separate opencode provider and are not usable under the Go subscription; do not route Go work to them."

