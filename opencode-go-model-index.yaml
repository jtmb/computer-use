models:
  "kimi-k3.1-pro":
    id: "opencode-go/kimi-k3.1-pro"
    name: "Kimi K3.1 Pro"
    provider: "opencode-go"
    status: "verified_go"
    role: "primary_builder.smart"
    tags: ["coding", "agentic", "long_horizon", "long_context", "reasoning", "debugging", "refactor", "planning", "architecture"]
    guidance: "Use for difficult multi-file implementation, architecture, and long-horizon debugging when one strong attempt is cheaper than repeated repairs. Start at high effort and raise to max only for ambiguous or previously failed work; it is verbose and expensive, so reserve it for tasks that justify the tokens."
    effort:
      control: "variant"
      values: ["low", "high", "max"]
      default: "high"
      escalate: "max after a failed verification on ambiguous or long-horizon work"
    context_tokens: 1048576
    max_output_tokens: 1048576
    pricing:
      input: 2.0
      output: 10.0
      cache_read: 0.2
      cache_write: 2.0
    monthly_allowance_usd: 15
    benchmarks:
      aa_intelligence: 55
      terminal_bench_4: 65.7
      deepswe_v1_1: 75.5
      output_tokens_index_m: 150
      cost_per_index_task_usd: 2.11
      output_tps: 77.1
      basis: "vendor and third-party; harness differs"
    limitations: ["verbose", "expensive", "monthly_cap_15", "cross_harness_evidence"]
    confidence: "high"
    sources: ["go_docs", "go_models", "oc_catalog", "kimi_blog", "aa_kimi", "vals_tb4"]

  "deepseek-v4.1-flash":
    id: "opencode-go/deepseek-v4.1-flash"
    name: "DeepSeek V4.1 Flash"
    provider: "opencode-go"
    status: "verified_go"
    role: "primary_builder.fast"
    tags: ["coding", "agentic", "long_context", "fast", "cheap", "debugging", "planning"]
    guidance: "Use as the default builder and planner for ordinary implementation, focused fixes, and dependency-aware planning where cost and first-pass completion both matter. Start at high effort and raise to max after a failed verification; it is verbose, so keep context tight and avoid max for routine edits."
